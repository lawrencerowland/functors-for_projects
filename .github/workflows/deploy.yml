name: Deploy to GitHub Pages
on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: 'pages'
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
      - run: npm ci
      - name: Check example models
        run: |
          node tests/grounded-theory-colimit.cjs
          node tests/functor-atlas.cjs
          node tests/functor-atlas-project-example.cjs
          node tests/simplicial-model.cjs
          node tests/milestone-context.cjs
          node tests/milestone-catalogue.cjs
          node tests/goi-interaction.cjs
          node tests/goi-page.cjs
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
